name: Inspect

on: push

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: init stuff
        uses: ./.github/actions/init

      - name: lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: init stuff
        uses: ./.github/actions/init

      - name: build
        run: npm run build

      - name: upload builds
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            dist/
            types/

  prep-pages:
    runs-on: ubuntu-latest

    if: ${{ github.ref == 'refs/heads/release' }}

    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Init Stuff
        uses: ./.github/actions/init

      - name: Download Builds
        uses: actions/download-artifact@v8
        with:
          name: build
          path: public

      - name: Copy Example
        run: |
          cp -r example public/example

      - name: upload example for pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  pages:
    runs-on: ubuntu-latest

    needs: prep-pages

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: deploy
        uses: actions/deploy-pages@v5
