name: Inspect

on: push

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: init stuff
        uses: ./.github/actions/init

      - name: lint
        run: yarn lint

  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: init stuff
        uses: ./.github/actions/init

      - name: build
        run: yarn build

      - name: upload builds
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist/
            types/

      - name: upload pages builds
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            dist/
            example/

  pages:
    if: ${{ github.ref == 'refs/heads/release' }}

    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: deploy
        uses: actions/deploy-pages@v4
